name: ci

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        # Windows Server 2022 ships a node-gyp-compatible Visual Studio toolchain.
        os: [ubuntu-latest, macos-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm pack --dry-run --ignore-scripts
